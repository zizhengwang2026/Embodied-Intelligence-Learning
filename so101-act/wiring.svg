<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrowO" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#EA580C"/>
    </marker>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#15803D"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>

  <text x="500" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#0F172A">SO-101 x D-Robotics S600 - Wiring &amp; Data-Flow Topology</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" font-style="italic" fill="#475569">PC &lt;-&gt; S600 = SSH network   |   S600 &lt;-&gt; servo = UART bus   |   S600 &lt;-&gt; camera = USB</text>

  <rect x="60" y="95" width="210" height="95" rx="10" fill="#6366F1" stroke="#4338CA" stroke-width="2.5"/>
  <text x="165" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">PC / Laptop</text>
  <text x="165" y="150" text-anchor="middle" font-size="12" fill="#EEF2FF">(your display only)</text>
  <text x="165" y="170" text-anchor="middle" font-size="12" fill="#EEF2FF">SSH terminal: MobaXterm</text>

  <rect x="730" y="95" width="210" height="95" rx="10" fill="#22C55E" stroke="#15803D" stroke-width="2.5"/>
  <text x="835" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">TOP CAMERA</text>
  <text x="835" y="150" text-anchor="middle" font-size="12" fill="#F0FDF4">topcam  /dev/video0</text>
  <text x="835" y="170" text-anchor="middle" font-size="12" fill="#F0FDF4">sees whole table</text>

  <rect x="350" y="300" width="300" height="135" rx="12" fill="#0F172A" stroke="#312E81" stroke-width="2.5"/>
  <text x="500" y="338" text-anchor="middle" font-size="19" font-weight="bold" fill="#fff">D-Robotics S600</text>
  <text x="500" y="362" text-anchor="middle" font-size="13" fill="#C7D2FE">(edge-AI brain)</text>
  <text x="500" y="384" text-anchor="middle" font-size="13" fill="#C7D2FE">ARM aarch64 - runs LeRobot + ACT</text>
  <text x="500" y="406" text-anchor="middle" font-size="13" fill="#C7D2FE">reads/writes servos, gets cameras</text>

  <rect x="700" y="310" width="210" height="95" rx="10" fill="#16A34A" stroke="#14532D" stroke-width="2.5"/>
  <text x="805" y="343" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">WRIST CAMERA</text>
  <text x="805" y="365" text-anchor="middle" font-size="12" fill="#F0FDF4">wristcam  /dev/video1</text>
  <text x="805" y="385" text-anchor="middle" font-size="12" fill="#F0FDF4">on follower wrist</text>

  <rect x="60" y="525" width="280" height="120" rx="12" fill="#F59E0B" stroke="#B45309" stroke-width="2.5"/>
  <text x="200" y="562" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F2937">LEADER ARM</text>
  <text x="200" y="586" text-anchor="middle" font-size="13" fill="#1F2937">(you bend it)</text>
  <text x="200" y="608" text-anchor="middle" font-size="13" fill="#1F2937">6x STS3215, 5V supply</text>
  <text x="200" y="628" text-anchor="middle" font-size="13" fill="#1F2937">compliant -&gt; reports angle</text>

  <rect x="660" y="525" width="280" height="120" rx="12" fill="#EF4444" stroke="#991B1B" stroke-width="2.5"/>
  <text x="800" y="562" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">FOLLOWER ARM</text>
  <text x="800" y="586" text-anchor="middle" font-size="13" fill="#FEE2E2">(does the task)</text>
  <text x="800" y="608" text-anchor="middle" font-size="13" fill="#FEE2E2">6x STS3215, 12V supply</text>
  <text x="800" y="628" text-anchor="middle" font-size="13" fill="#FEE2E2">high-torque -&gt; executes</text>

  <line x1="270" y1="160" x2="430" y2="320" stroke="#2563EB" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arrowB)"/>
  <text x="320" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563EB">SSH (Ethernet/WiFi)</text>

  <line x1="700" y1="340" x2="800" y2="180" stroke="#22C55E" stroke-width="3" marker-end="url(#arrowG)"/>
  <text x="770" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803D">USB0</text>

  <line x1="690" y1="350" x2="720" y2="360" stroke="#16A34A" stroke-width="3" marker-end="url(#arrowG)"/>
  <text x="715" y="395" dist="" x="715" y="395" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532D">USB1</text>

  <line x1="450" y1="440" x2="240" y2="525" stroke="#EA580C" stroke-width="3.5" marker-end="url(#arrowO)"/>
  <text x="245" y="470" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#C2410C">leader_port /dev/ttyACM1</text>
  <text x="245" y="488" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#C2410C">3-wire bus, 5V supply</text>

  <line x1="560" y1="440" x2="760" y2="525" stroke="#EA580C" stroke-width="3.5" marker-end="url(#arrowO)"/>
  <text x="760" y="470" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#C2410C">follower_port /dev/ttyACM0</text>
  <text x="760" y="488" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#C2410C">3-wire bus, 12V supply</text>

  <rect x="360" y="455" width="280" height="62" rx="12" fill="#EEF2FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="500" y="492" text-anchor="middle" font-size="14" font-weight="bold" fill="#6D28D9">closed loop: sense -&gt; decide -&gt; act</text>
  <text x="500" y="512" text-anchor="middle" font-size="12" fill="#6D28D9">(30-50 Hz)</text>

  <text x="400" y="640" font-size="13" font-weight="bold" fill="#0F172A">Servo 3-wire bus legend:</text>
  <rect x="400" y="650" width="18" height="14" fill="#EF4444"/>
  <text x="425" y="662" font-size="12" fill="#334155">red = VCC (power)</text>
  <rect x="555" y="650" width="18" height="14" fill="#1F2937"/>
  <text x="580" y="662" font-size="12" fill="#334155">black = GND (ground)</text>
  <rect x="710" y="650" width="18" height="14" fill="#FACC15"/>
  <text x="735" y="662" font-size="12" fill="#334155">yellow = DATA (UART)</text>
</svg>