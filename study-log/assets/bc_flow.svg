<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" font-family="Segoe UI, Arial, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#718096"/>
    </marker>
  </defs>
  <rect width="700" height="260" fill="#ffffff"/>
  <text x="350" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a202c">行为克隆 BC：从人类示教直接学 状态→动作</text>

  <rect x="30" y="90" width="140" height="70" rx="8" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="100" y="118" text-anchor="middle" font-size="13" fill="#1a202c">人类示教</text>
  <text x="100" y="140" text-anchor="middle" font-size="12" fill="#4a5568">遥操作 / 演示</text>

  <line x1="170" y1="125" x2="208" y2="125" stroke="#718096" stroke-width="2" marker-end="url(#ar)"/>
  <text x="189" y="113" text-anchor="middle" font-size="10" fill="#718096">(s,a)</text>

  <rect x="213" y="90" width="150" height="70" rx="8" fill="#fffaf0" stroke="#dd6b20" stroke-width="2"/>
  <text x="288" y="116" text-anchor="middle" font-size="13" fill="#1a202c">数据集</text>
  <text x="288" y="138" text-anchor="middle" font-size="12" fill="#4a5568">{(s₁,a₁)…(sₙ,aₙ)}</text>
  <text x="288" y="156" text-anchor="middle" font-size="11" fill="#4a5568">状态→动作对</text>

  <line x1="363" y1="125" x2="401" y2="125" stroke="#718096" stroke-width="2" marker-end="url(#ar)"/>
  <text x="382" y="113" text-anchor="middle" font-size="10" fill="#718096">监督学习</text>

  <rect x="406" y="90" width="150" height="70" rx="8" fill="#f0fff4" stroke="#38a169" stroke-width="2"/>
  <text x="481" y="116" text-anchor="middle" font-size="13" fill="#1a202c">策略 π(a|s)</text>
  <text x="481" y="138" text-anchor="middle" font-size="12" fill="#4a5568">模仿专家分布</text>
  <text x="481" y="156" text-anchor="middle" font-size="11" fill="#4a5568">如 ACT / 扩散策略</text>

  <line x1="556" y1="125" x2="594" y2="125" stroke="#718096" stroke-width="2" marker-end="url(#ar)"/>
  <text x="575" y="113" text-anchor="middle" font-size="10" fill="#718096">部署</text>

  <rect x="599" y="90" width="80" height="70" rx="8" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="639" y="118" text-anchor="middle" font-size="13" fill="#1a202c">机器人</text>
  <text x="639" y="140" text-anchor="middle" font-size="12" fill="#4a5568">自主执行</text>

  <text x="350" y="210" text-anchor="middle" font-size="13" fill="#2d3748">BC = 模仿学习最简单形式：直接监督学习「看到状态就出专家动作」，自己不试错。</text>
  <text x="350" y="234" text-anchor="middle" font-size="12" fill="#718096">优点：稳、快；缺点：分布偏移(误差累积→渐远自航)，需大量高质量示教。</text>
</svg>