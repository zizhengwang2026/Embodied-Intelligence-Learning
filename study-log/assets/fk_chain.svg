<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="680" height="400" fill="#ffffff"/>
  <text x="24" y="32" font-size="18" font-weight="700" fill="#1a1a1a">正运动学 FK：两级连杆链式变换</text>
  <line x1="120" y1="340" x2="185" y2="340" stroke="#bbb" stroke-width="1"/>
  <line x1="120" y1="340" x2="120" y2="278" stroke="#bbb" stroke-width="1"/>
  <text x="189" y="344" font-size="12" fill="#888">x</text>
  <text x="110" y="272" font-size="12" fill="#888">y</text>
  <circle cx="120" cy="340" r="7" fill="#2563eb"/>
  <text x="120" y="364" font-size="13" fill="#1a1a1a" text-anchor="middle">base</text>
  <line x1="120" y1="340" x2="234.7" y2="219.7" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
  <circle cx="234.7" cy="219.7" r="6" fill="#1a1a1a"/>
  <text x="244" y="214" font-size="13" fill="#1a1a1a">joint1 (θ1)</text>
  <line x1="234.7" y1="219.7" x2="350.6" y2="250.8" stroke="#16a34a" stroke-width="6" stroke-linecap="round"/>
  <circle cx="350.6" cy="250.8" r="7" fill="#dc2626"/>
  <text x="360" y="254" font-size="13" fill="#dc2626">末端 EE</text>
  <text x="150" y="292" font-size="13" fill="#2563eb">L1</text>
  <text x="286" y="248" font-size="13" fill="#16a34a">L2</text>
  <path d="M 160 340 A 40 40 0 0 0 153 312" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="166" y="322" font-size="12" fill="#f59e0b">θ1</text>
  <rect x="430" y="120" width="226" height="124" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="446" y="150" font-size="14" fill="#1a1a1a">末端坐标（平面）：</text>
  <text x="446" y="176" font-size="14" fill="#1a1a1a">x = L1·cosθ1</text>
  <text x="470" y="196" font-size="14" fill="#1a1a1a">+ L2·cos(θ1+θ2)</text>
  <text x="446" y="222" font-size="14" fill="#1a1a1a">y = L1·sinθ1</text>
  <text x="470" y="242" font-size="14" fill="#1a1a1a">+ L2·sin(θ1+θ2)</text>
  <text x="24" y="392" font-size="12" fill="#64748b">每级用 4×4 齐次变换矩阵 T=[R t;0 1]，总变换 = T1·T2·…·Tn</text>
</svg>
