<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="Segoe UI, Arial, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#718096"/>
    </marker>
  </defs>
  <rect width="700" height="320" fill="#ffffff"/>
  <text x="350" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a202c">Q-learning：用 Q 表迭代最优动作价值</text>

  <!-- Q table -->
  <rect x="60" y="60" width="300" height="180" rx="8" fill="#f7fafc" stroke="#cbd5e0" stroke-width="2"/>
  <text x="80" y="82" font-size="12" fill="#1a202c">Q(s,a)</text>
  <!-- column headers a1 a2 a3 -->
  <text x="160" y="100" text-anchor="middle" font-size="12" fill="#4a5568">a₁</text>
  <text x="220" y="100" text-anchor="middle" font-size="12" fill="#4a5568">a₂</text>
  <text x="280" y="100" text-anchor="middle" font-size="12" fill="#4a5568">a₃</text>
  <text x="100" y="124" font-size="12" fill="#4a5568">s₁</text>
  <text x="100" y="164" font-size="12" fill="#4a5568">s₂</text>
  <text x="100" y="204" font-size="12" fill="#4a5568">s₃</text>
  <!-- cells -->
  <text x="160" y="124" text-anchor="middle" font-size="12" fill="#2b6cb0">0.2</text>
  <text x="220" y="124" text-anchor="middle" font-size="12" fill="#2b6cb0">1.5*</text>
  <text x="280" y="124" text-anchor="middle" font-size="12" fill="#2b6cb0">0.8</text>
  <text x="160" y="164" text-anchor="middle" font-size="12" fill="#2b6cb0">0.9</text>
  <text x="220" y="164" text-anchor="middle" font-size="12" fill="#2b6cb0">0.4</text>
  <text x="280" y="164" text-anchor="middle" font-size="12" fill="#2b6cb0">0.6</text>
  <text x="160" y="204" text-anchor="middle" font-size="12" fill="#2b6cb0">0.3</text>
  <text x="220" y="204" text-anchor="middle" font-size="12" fill="#2b6cb0">0.7</text>
  <text x="280" y="204" text-anchor="middle" font-size="12" fill="#2b6cb0">1.1</text>
  <!-- highlight max in s1 -->
  <rect x="200" y="108" width="40" height="22" fill="none" stroke="#e53e3e" stroke-width="2"/>
  <text x="350" y="120" font-size="11" fill="#e53e3e">max_a' Q(s',a')</text>

  <!-- update formula -->
  <rect x="400" y="60" width="260" height="100" rx="8" fill="#fffaf0" stroke="#dd6b20" stroke-width="2"/>
  <text x="416" y="86" font-size="12" fill="#1a202c">Bellman 更新：</text>
  <text x="416" y="110" font-size="12" fill="#2d3748">Q(s,a) ← Q(s,a)</text>
  <text x="428" y="130" font-size="12" fill="#2d3748">+ α[ r + γ·max Q(s',a')</text>
  <text x="428" y="150" font-size="12" fill="#2d3748">− Q(s,a) ]</text>

  <text x="350" y="270" text-anchor="middle" font-size="13" fill="#2d3748">表格法适合离散小状态/动作；α 学习率，γ 折扣，ε-贪婪探索。</text>
  <text x="350" y="292" text-anchor="middle" font-size="12" fill="#718096">Q-learning 是 off-policy：用「下一态最大 Q」做目标，不要求当前就按它行动。</text>
</svg>