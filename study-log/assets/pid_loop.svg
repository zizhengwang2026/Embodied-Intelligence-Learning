<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="Segoe UI, Arial, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#718096"/>
    </marker>
  </defs>
  <rect width="700" height="300" fill="#ffffff"/>
  <text x="350" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a202c">PID 闭环控制：用误差驱动执行器</text>

  <!-- reference -->
  <rect x="30" y="120" width="90" height="50" rx="8" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="75" y="140" text-anchor="middle" font-size="12" fill="#1a202c">参考</text>
  <text x="75" y="158" text-anchor="middle" font-size="12" fill="#1a202c">r (目标)</text>

  <!-- sum -->
  <circle cx="160" cy="145" r="20" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
  <text x="160" y="150" text-anchor="middle" font-size="16" fill="#1a202c">Σ</text>
  <text x="160" y="185" text-anchor="middle" font-size="11" fill="#718096">e = r − y</text>

  <!-- pid -->
  <rect x="210" y="110" width="140" height="70" rx="8" fill="#fffaf0" stroke="#dd6b20" stroke-width="2"/>
  <text x="280" y="135" text-anchor="middle" font-size="14" fill="#1a202c">PID 控制器</text>
  <text x="280" y="158" text-anchor="middle" font-size="11" fill="#4a5568">u = Kp·e + Ki·∫e + Kd·de/dt</text>

  <!-- plant -->
  <rect x="400" y="110" width="140" height="70" rx="8" fill="#f0fff4" stroke="#38a169" stroke-width="2"/>
  <text x="470" y="135" text-anchor="middle" font-size="13" fill="#1a202c">被控对象</text>
  <text x="470" y="158" text-anchor="middle" font-size="12" fill="#4a5568">电机 / 机械臂</text>

  <!-- output -->
  <rect x="580" y="120" width="90" height="50" rx="8" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="625" y="140" text-anchor="middle" font-size="12" fill="#1a202c">输出</text>
  <text x="625" y="158" text-anchor="middle" font-size="12" fill="#1a202c">y</text>

  <!-- arrows -->
  <line x1="120" y1="145" x2="138" y2="145" stroke="#718096" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="180" y1="145" x2="208" y2="145" stroke="#718096" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="350" y1="145" x2="398" y2="145" stroke="#718096" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="540" y1="145" x2="578" y2="145" stroke="#718096" stroke-width="2" marker-end="url(#ar)"/>
  <!-- feedback -->
  <path d="M625 170 L625 250 L75 250 L75 170" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#ar)"/>
  <text x="350" y="270" text-anchor="middle" font-size="12" fill="#718096">传感器把实际输出 y 反馈回求和点，形成闭环</text>

  <text x="350" y="292" text-anchor="middle" font-size="12" fill="#2d3748">P 管当前偏差 · I 消累计静差 · D 预判趋势(提供阻尼)</text>
</svg>